<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="system-ui, sans-serif" font-size="12">
  <!-- User -->
  <rect x="20" y="20" width="140" height="110" rx="6" fill="#e0f0ff" stroke="#4F7EF7" stroke-width="1.5"/>
  <rect x="20" y="20" width="140" height="28" rx="6" fill="#4F7EF7"/>
  <rect x="20" y="42" width="140" height="6" rx="0" fill="#4F7EF7"/>
  <text x="90" y="39" text-anchor="middle" fill="white" font-weight="bold">User</text>
  <text x="30" y="65" fill="#333">+ email_address</text>
  <text x="30" y="82" fill="#333">+ password_digest</text>
  <text x="30" y="99" fill="#777" font-size="11">has_many: sessions</text>
  <text x="30" y="116" fill="#777" font-size="11">has_many: projects (owner)</text>

  <!-- Session -->
  <rect x="20" y="160" width="140" height="90" rx="6" fill="#e0f0ff" stroke="#4F7EF7" stroke-width="1.5"/>
  <rect x="20" y="160" width="140" height="28" rx="6" fill="#4F7EF7"/>
  <rect x="20" y="182" width="140" height="6" fill="#4F7EF7"/>
  <text x="90" y="179" text-anchor="middle" fill="white" font-weight="bold">Session</text>
  <text x="30" y="203" fill="#333">+ user_id (FK)</text>
  <text x="30" y="220" fill="#333">+ user_agent</text>
  <text x="30" y="237" fill="#333">+ ip_address</text>

  <!-- Project -->
  <rect x="220" y="20" width="150" height="110" rx="6" fill="#fff3e0" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="220" y="20" width="150" height="28" rx="6" fill="#f59e0b"/>
  <rect x="220" y="42" width="150" height="6" fill="#f59e0b"/>
  <text x="295" y="39" text-anchor="middle" fill="white" font-weight="bold">Project</text>
  <text x="230" y="65" fill="#333">+ name</text>
  <text x="230" y="82" fill="#333">+ description</text>
  <text x="230" y="99" fill="#333">+ owner_id (FK)</text>
  <text x="230" y="116" fill="#777" font-size="11">has_many: tasks</text>

  <!-- Membership -->
  <rect x="220" y="160" width="150" height="90" rx="6" fill="#fff3e0" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="220" y="160" width="150" height="28" rx="6" fill="#f59e0b"/>
  <rect x="220" y="182" width="150" height="6" fill="#f59e0b"/>
  <text x="295" y="179" text-anchor="middle" fill="white" font-weight="bold">Membership</text>
  <text x="230" y="203" fill="#333">+ user_id (FK)</text>
  <text x="230" y="220" fill="#333">+ project_id (FK)</text>
  <text x="230" y="237" fill="#333">+ role</text>

  <!-- Task -->
  <rect x="440" y="20" width="160" height="160" rx="6" fill="#f0fff4" stroke="#10b981" stroke-width="1.5"/>
  <rect x="440" y="20" width="160" height="28" rx="6" fill="#10b981"/>
  <rect x="440" y="42" width="160" height="6" fill="#10b981"/>
  <text x="520" y="39" text-anchor="middle" fill="white" font-weight="bold">Task</text>
  <text x="450" y="65" fill="#333">+ project_id (FK)</text>
  <text x="450" y="82" fill="#333">+ assignee_id (FK)</text>
  <text x="450" y="99" fill="#333">+ title</text>
  <text x="450" y="116" fill="#333">+ description</text>
  <text x="450" y="133" fill="#333">+ status</text>
  <text x="450" y="150" fill="#333">+ priority</text>
  <text x="450" y="167" fill="#333">+ due_on</text>

  <!-- Comment -->
  <rect x="440" y="210" width="160" height="100" rx="6" fill="#f0fff4" stroke="#10b981" stroke-width="1.5"/>
  <rect x="440" y="210" width="160" height="28" rx="6" fill="#10b981"/>
  <rect x="440" y="232" width="160" height="6" fill="#10b981"/>
  <text x="520" y="229" text-anchor="middle" fill="white" font-weight="bold">Comment</text>
  <text x="450" y="253" fill="#333">+ task_id (FK)</text>
  <text x="450" y="270" fill="#333">+ user_id (FK)</text>
  <text x="450" y="287" fill="#333">+ body</text>

  <!-- Notification -->
  <rect x="660" y="20" width="170" height="120" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="660" y="20" width="170" height="28" rx="6" fill="#a855f7"/>
  <rect x="660" y="42" width="170" height="6" fill="#a855f7"/>
  <text x="745" y="39" text-anchor="middle" fill="white" font-weight="bold">Notification</text>
  <text x="670" y="65" fill="#333">+ user_id (FK)</text>
  <text x="670" y="82" fill="#333">+ task_id (FK)</text>
  <text x="670" y="99" fill="#333">+ kind</text>
  <text x="670" y="116" fill="#333">+ read_at</text>

  <!-- Relations: User -> Session -->
  <line x1="90" y1="130" x2="90" y2="160" stroke="#4F7EF7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- User -> Project (owner) -->
  <line x1="160" y1="60" x2="220" y2="60" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="163" y="55" fill="#999" font-size="10">owns</text>

  <!-- User -> Membership -->
  <line x1="160" y1="200" x2="220" y2="200" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Project -> Task -->
  <line x1="370" y1="70" x2="440" y2="70" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="65" fill="#999" font-size="10">has many</text>

  <!-- Project -> Membership -->
  <line x1="295" y1="130" x2="295" y2="160" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Task -> Comment -->
  <line x1="520" y1="180" x2="520" y2="210" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Task -> Notification -->
  <line x1="600" y1="80" x2="660" y2="80" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User -> Notification -->
  <line x1="160" y1="75" x2="660" y2="75" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- User -> Comment (via task) -->
  <line x1="160" y1="85" x2="440" y2="260" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="290" width="820" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="35" y="312" fill="#555" font-size="11" font-weight="bold">凡例：</text>
  <line x1="80" y1="308" x2="110" y2="308" stroke="#999" stroke-width="1.5"/>
  <polygon points="110,305 110,311 116,308" fill="#999"/>
  <text x="120" y="312" fill="#555" font-size="11">has many / belongs to</text>
  <line x1="250" y1="308" x2="280" y2="308" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="290" y="312" fill="#555" font-size="11">関連（JOIN）</text>
  <rect x="380" y="302" width="12" height="12" rx="2" fill="#4F7EF7"/>
  <text x="396" y="312" fill="#555" font-size="11">User / Session</text>
  <rect x="490" y="302" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="506" y="312" fill="#555" font-size="11">Project / Membership</text>
  <rect x="630" y="302" width="12" height="12" rx="2" fill="#10b981"/>
  <text x="646" y="312" fill="#555" font-size="11">Task / Comment</text>
  <rect x="740" y="302" width="12" height="12" rx="2" fill="#a855f7"/>
  <text x="756" y="312" fill="#555" font-size="11">Notification</text>
</svg>
